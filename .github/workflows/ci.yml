name: Foundation checks
on:
  push:
    branches: [main, 'feat/**', 'feature/**', 'domain/**', 'research/**']
  pull_request:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
  world3d-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install chromium --with-deps
      - run: node scripts/world3d-smoke.cjs
      - run: node scripts/browser-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: world3d-browser-views
          path: artifacts/*.png
          retention-days: 7
